<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c"/>
      <stop offset="60%" stop-color="#1e3e62"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="accentGradM" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <clipPath id="mobileFlagClip">
      <rect x="0" y="0" width="120" height="76" rx="12"/>
    </clipPath>
    <clipPath id="miniFlagClipM">
      <rect x="0" y="0" width="30" height="20" rx="4"/>
    </clipPath>
  </defs>

  <rect width="800" height="480" fill="url(#bgGradM)"/>
  <circle cx="680" cy="120" r="220" fill="#0284c7" opacity="0.22" filter="blur(50px)"/>

  <!-- Right Floating Flag Graphic on Mobile -->
  <g transform="translate(620, 60)" opacity="0.95">
    <g clip-path="url(#mobileFlagClip)">
      <image href="data:image/png;base64," xlink:href="data:image/png;base64," x="0" y="0" width="120" height="76" preserveAspectRatio="xMidYMid slice"/>
    </g>
    <rect x="0" y="0" width="120" height="76" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>

  <g transform="translate(40, 50)">
    <!-- Top Pill Badge -->
    <g>
      <rect x="0" y="0" width="220" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
      <g transform="translate(8, 7)" clip-path="url(#miniFlagClipM)">
        <image href="data:image/png;base64," xlink:href="data:image/png;base64," x="0" y="0" width="30" height="20" preserveAspectRatio="xMidYMid slice"/>
      </g>
      <text x="46" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">OFFICIAL VISA SERVICES</text>
    </g>

    <!-- Title -->
    <text x="0" y="105" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800">North Macedonia Visa</text>
    
    <!-- Subtitle -->
    <text x="0" y="145" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">Online Visa Application for Pakistanis</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="75" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Fast Approval</text>
      
      <rect x="160" y="0" width="165" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="242.5" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📄 99% Success Rate</text>
    </g>
  </g>
</svg>