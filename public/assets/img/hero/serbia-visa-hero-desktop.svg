<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c"/>
      <stop offset="50%" stop-color="#1e3e62"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <clipPath id="flagClip">
      <rect x="0" y="0" width="220" height="140" rx="16"/>
    </clipPath>
    <clipPath id="miniFlagClip">
      <rect x="0" y="0" width="36" height="24" rx="6"/>
    </clipPath>
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="flagShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="450" fill="url(#bgGrad)"/>
  
  <!-- Glowing Background Orbs -->
  <circle cx="1380" cy="140" r="320" fill="#0284c7" opacity="0.22" filter="blur(70px)"/>
  <circle cx="1520" cy="360" r="240" fill="#38bdf8" opacity="0.15" filter="blur(60px)"/>
  <circle cx="200" cy="400" r="260" fill="#0284c7" opacity="0.1" filter="blur(80px)"/>

  <!-- Decorative Travel Rays / Compass Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1.5">
    <circle cx="1300" cy="225" r="260" fill="none" stroke-dasharray="6 6"/>
    <circle cx="1300" cy="225" r="180" fill="none"/>
    <line x1="0" y1="225" x2="1600" y2="225"/>
    <line x1="1300" y1="0" x2="1300" y2="450"/>
  </g>

  <!-- Right Side Glassmorphism Spotlight Card featuring Official Flag -->
  <g transform="translate(1180, 50)" filter="url(#glassShadow)">
    <!-- Glass Background Container -->
    <rect x="0" y="0" width="340" height="350" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
    
    <!-- Flag Backdrop Glow -->
    <rect x="60" y="45" width="220" height="140" rx="16" fill="#38bdf8" opacity="0.35" filter="blur(20px)"/>

    <!-- Official Flag Image (Base64 Inlined) -->
    <g transform="translate(60, 45)" filter="url(#flagShadow)">
      <g clip-path="url(#flagClip)">
        <image href="data:image/png;base64," xlink:href="data:image/png;base64," x="0" y="0" width="220" height="140" preserveAspectRatio="xMidYMid slice"/>
      </g>
      <!-- Flag Border -->
      <rect x="0" y="0" width="220" height="140" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    </g>

    <!-- Country Label Below Flag -->
    <text x="170" y="235" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="1.5">SERBIA</text>
    
    <!-- Verified Destination Badge -->
    <g transform="translate(65, 265)">
      <rect x="0" y="0" width="210" height="36" rx="18" fill="url(#accentGrad)"/>
      <text x="105" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.5">✓ VERIFIED DESTINATION</text>
    </g>
  </g>

  <!-- Left Content Group -->
  <g transform="translate(80, 75)">
    <!-- Top Pill Badge with Mini Country Flag -->
    <g>
      <rect x="0" y="0" width="260" height="38" rx="19" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.5"/>
      <g transform="translate(8, 7)" clip-path="url(#miniFlagClip)">
        <image href="data:image/png;base64," xlink:href="data:image/png;base64," x="0" y="0" width="36" height="24" preserveAspectRatio="xMidYMid slice"/>
      </g>
      <text x="54" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">OFFICIAL VISA SERVICES</text>
    </g>
    
    <!-- Title -->
    <text x="0" y="112" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-0.5">Serbia Visa</text>
    
    <!-- Subtitle -->
    <text x="0" y="156" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400">Fast &amp; Priority Online Visa Application for Pakistani Citizens</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="165" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="82.5" y="22.5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Fast Approval</text>
      
      <rect x="180" y="0" width="180" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="270" y="22.5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📄 99% Success Rate</text>
      
      <rect x="375" y="0" width="175" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="462.5" y="22.5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">💬 24/7 Support</text>
    </g>
  </g>
</svg>