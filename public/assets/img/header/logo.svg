<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="mark-blue-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0047BA" />
    </linearGradient>
    <linearGradient id="mark-amber-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E00" />
      <stop offset="60%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#E53835" />
    </linearGradient>
    <linearGradient id="text-ozo-blue-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052CC" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <linearGradient id="text-trips-amber-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="60%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 8)">
    <path d="M 42 6 A 36 36 0 1 0 78 42 C 78 38.5 74.5 37 72 38 C 69.5 39 67.5 41.5 67.5 42 A 25.5 25.5 0 1 1 42 16.5 C 49 16.5 55 19 60 23.5 C 62.5 25.5 66 25 67.5 22.5 C 69 20 68 16.5 65.5 14.5 C 59 9.5 51 6 42 6 Z" 
          fill="url(#mark-blue-l)" />

    <path d="M 14 56 C 21 66 35 71 47 69 C 61 66 71 56 76 42 C 78 37 81 30 87 20" 
          stroke="url(#mark-amber-l)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <g transform="translate(85, 18) rotate(42) scale(1)">
      <path d="M 0 -13 L 4.5 2 L 13 5.5 L 13 8 L 4.5 7 L 3 12 L 6.5 15 L 6.5 17 L 0 16 L -6.5 17 L -6.5 15 L -3 12 L -4.5 7 L -13 8 L -13 5.5 L -4.5 2 Z" 
            fill="url(#mark-amber-l)" />
      <circle cx="0" cy="-5" r="1.3" fill="#FFFFFF" />
    </g>

    <polygon points="42,18 43.8,24 50,25.8 43.8,27.6 42,33.5 40.2,27.6 34,25.8 40.2,24" fill="url(#mark-amber-l)" opacity="0.95" />
  </g>

  <!-- WORDMARK: Royal Blue OZO + Sunset Amber TRIPS -->
  <text x="114" y="56" 
        font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', -apple-system, sans-serif" 
        font-size="40" 
        font-weight="900" 
        letter-spacing="-0.5px">
    <tspan fill="url(#text-ozo-blue-l)">OZO</tspan>
    <tspan fill="url(#text-trips-amber-l)" font-weight="800" dx="2">TRIPS</tspan>
  </text>

  <!-- Tagline -->
  <text x="116" y="78" 
        font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" 
        font-size="10.5" 
        font-weight="700" 
        letter-spacing="5.5px" 
        fill="#64748B">EXPLORE THE WORLD</text>
</svg>
