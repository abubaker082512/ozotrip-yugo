<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="c2-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="c2-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="c2-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="c2-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0284C7" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- ICON: Geo-Pin + Twin Mountain Peaks + Compass Star -->
  <g transform="translate(18, 10)" filter="url(#c2-shadow)">
    <!-- Geo Pin Outer Frame -->
    <path d="M 50 8 C 28 8 12 24 12 45 C 12 65 36 88 47 97.5 C 48.8 99 51.2 99 53 97.5 C 64 88 88 65 88 45 C 88 24 72 8 50 8 Z" 
          fill="url(#c2-primary)" />

    <!-- Inner Cutout/Negative Space Window -->
    <path d="M 50 16 C 33.5 16 20 29.5 20 45 C 20 59.5 38 78 50 87.5 C 62 78 80 59.5 80 45 C 80 29.5 66.5 16 50 16 Z" 
          fill="#FFFFFF" />

    <!-- Mountain Peaks (Passu / Himalayas / Adventure) inside Pin -->
    <!-- Back Peak (Deep Blue) -->
    <polygon points="50,34 32,68 68,68" fill="url(#c2-primary)" opacity="0.9" />
    <!-- Front Peak (Teal highlight) -->
    <polygon points="62,42 46,68 76,68" fill="url(#c2-teal)" opacity="0.85" />
    <!-- Snowcaps -->
    <polygon points="50,34 45,43 55,43" fill="#FFFFFF" />
    <polygon points="62,42 58,49 67,49" fill="#FFFFFF" />

    <!-- Horizon Sun / Compass Star above peaks -->
    <g transform="translate(50, 26)">
      <!-- 4-point golden star -->
      <path d="M 0 -11 L 2.5 -3 L 10 0 L 2.5 3 L 0 11 L -2.5 3 L -10 0 L -2.5 -3 Z" fill="url(#c2-gold)" />
      <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
    </g>
  </g>

  <!-- WORDMARK: OzoTrips -->
  <!-- "Ozo" -->
  <text x="135" y="72" 
        font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" 
        font-size="46" 
        font-weight="800" 
        letter-spacing="-1px" 
        fill="#0F172A">Ozo</text>

  <!-- "Trips" -->
  <text x="225" y="72" 
        font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" 
        font-size="46" 
        font-weight="700" 
        letter-spacing="-0.5px" 
        fill="url(#c2-teal)">Trips</text>

  <!-- Golden Location Accent Bar -->
  <rect x="137" y="82" width="28" height="3.5" rx="1.75" fill="url(#c2-gold)" />

  <!-- Tagline -->
  <text x="175" y="86" 
        font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" 
        font-size="11.5" 
        font-weight="600" 
        letter-spacing="3.8px" 
        fill="#64748B">TOURS • FLIGHTS • UMRAH</text>
</svg>
