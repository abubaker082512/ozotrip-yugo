<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="c3-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="c3-coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <linearGradient id="c3-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="c3-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4F46E5" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ICON: Interlocking Infinity Orbit Rings (Letter 'O' + Global Horizons) -->
  <g transform="translate(20, 14)" filter="url(#c3-glow)">
    <!-- Primary Loop (Left/Top) -->
    <path d="M 46 16 C 68 16 84 32 84 52 C 84 72 68 84 50 84 C 30 84 14 68 14 48 C 14 30 28 16 46 16 Z" 
          stroke="url(#c3-indigo)" stroke-width="11" stroke-linecap="round" fill="none" />

    <!-- Secondary Intersecting Wing / Flight Arc (Warm Coral-Orange) -->
    <path d="M 28 72 C 40 86 64 88 80 76 C 94 66 98 48 90 32 C 86 24 80 16 72 10" 
          stroke="url(#c3-coral)" stroke-width="8.5" stroke-linecap="round" fill="none" opacity="0.95" />

    <!-- Center Flight Cross-Arrow / Wing Star -->
    <path d="M 48 36 L 56 48 L 70 50 L 58 58 L 54 70 L 46 60 L 34 62 L 42 52 Z" 
          fill="url(#c3-coral)" />
    <circle cx="50" cy="50" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- WORDMARK: OzoTrips -->
  <g transform="translate(142, 0)">
    <!-- "ozo" in all-caps modern geometric sans -->
    <text x="0" y="68" 
          font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" 
          font-size="46" 
          font-weight="900" 
          letter-spacing="-1px" 
          fill="url(#c3-text)">ozo</text>

    <!-- "trips" with color gradient -->
    <text x="96" y="68" 
          font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" 
          font-size="46" 
          font-weight="500" 
          letter-spacing="-0.5px" 
          fill="url(#c3-indigo)">trips</text>

    <text x="216" y="52" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="20" 
          font-weight="800" 
          fill="url(#c3-coral)">.</text>
    <text x="224" y="68" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="26" 
          font-weight="700" 
          fill="url(#c3-coral)">com</text>

    <!-- Subtitle -->
    <text x="3" y="92" 
          font-family="'Outfit', sans-serif" 
          font-size="11" 
          font-weight="700" 
          letter-spacing="5px" 
          fill="#94A3B8">TRAVEL EXPERIENCES REDEFINED</text>
  </g>
</svg>
