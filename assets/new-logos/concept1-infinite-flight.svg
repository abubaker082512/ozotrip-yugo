<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="oz-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="60%" stop-color="#0047BA" />
      <stop offset="100%" stop-color="#002D80" />
    </linearGradient>
    <linearGradient id="oz-sunset-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E00" />
      <stop offset="50%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#E53835" />
    </linearGradient>
    <linearGradient id="oz-sky-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C9FF" />
      <stop offset="100%" stop-color="#92FE9D" />
    </linearGradient>
    <filter id="oz-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0047BA" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- ICON MARK (Left: X=10 to 110, Y=10 to 110) -->
  <g transform="translate(15, 10)">
    <!-- Ambient Backing Glow Ring -->
    <circle cx="50" cy="50" r="46" fill="url(#oz-blue-grad)" opacity="0.06" />

    <!-- Outer Orbit Ring (The 'O' of Ozo) -->
    <path d="M 50 8 A 42 42 0 1 0 92 50 C 92 46 88 44 85 45 C 82 46 80 49 80 50 A 30 30 0 1 1 50 20 C 58 20 65 23 71 28 C 74 30.5 78 30 80 27 C 82 24 81 20 78 17.5 C 70 11.5 60.5 8 50 8 Z" 
          fill="url(#oz-blue-grad)" />

    <!-- Ascending Supersonic Flight Jet & Dynamic Trajectory -->
    <!-- Contrail Swoop (Sunset Amber) -->
    <path d="M 16 66 C 24 78 40 84 56 81 C 72 78 84 66 90 50 C 92 44 95 36 102 24" 
          stroke="url(#oz-sunset-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <path d="M 28 76 C 42 84 58 83 72 75 C 82 69 90 59 95 47" 
          stroke="url(#oz-sunset-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

    <!-- Supersonic Jet Icon at Apex -->
    <g transform="translate(100, 22) rotate(42) scale(1.15)">
      <path d="M 0 -14 L 5 2 L 14 6 L 14 9 L 5 8 L 3 14 L 7 17 L 7 19 L 0 18 L -7 19 L -7 17 L -3 14 L -5 8 L -14 9 L -14 6 L -5 2 Z" 
            fill="url(#oz-sunset-grad)" filter="url(#oz-shadow)" />
      <circle cx="0" cy="-6" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- Compass North Star Indicator -->
    <polygon points="50,22 52,29 59,31 52,33 50,40 48,33 41,31 48,29" fill="url(#oz-sunset-grad)" opacity="0.9" />
  </g>

  <!-- WORDMARK: OzoTrips -->
  <!-- "OZO" (Heavy, Geometric Navy) -->
  <text x="145" y="72" 
        font-family="'Outfit', 'Montserrat', 'Inter', -apple-system, sans-serif" 
        font-size="48" 
        font-weight="900" 
        letter-spacing="-1.5px" 
        fill="#0A1E3F">OZO</text>

  <!-- "TRIPS" (Gradient Royal Blue) -->
  <text x="260" y="72" 
        font-family="'Outfit', 'Montserrat', 'Inter', -apple-system, sans-serif" 
        font-size="48" 
        font-weight="700" 
        letter-spacing="-0.5px" 
        fill="url(#oz-blue-grad)">TRIPS</text>

  <!-- Globe Dot or Accent Badge on .COM -->
  <circle cx="432" cy="65" r="5" fill="url(#oz-sunset-grad)" />

  <!-- Tagline / Descriptor -->
  <text x="148" y="96" 
        font-family="'Outfit', 'Montserrat', 'Inter', -apple-system, sans-serif" 
        font-size="12" 
        font-weight="700" 
        letter-spacing="5.5px" 
        fill="#64748B">EXPLORE THE WORLD</text>
</svg>
