<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="oz-blue-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="oz-sunset-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="60%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="oz-glow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- ICON MARK -->
  <g transform="translate(15, 10)" filter="url(#oz-glow-dark)">
    <circle cx="50" cy="50" r="46" fill="#38BDF8" opacity="0.1" />

    <!-- Outer Orbit Ring -->
    <path d="M 50 8 A 42 42 0 1 0 92 50 C 92 46 88 44 85 45 C 82 46 80 49 80 50 A 30 30 0 1 1 50 20 C 58 20 65 23 71 28 C 74 30.5 78 30 80 27 C 82 24 81 20 78 17.5 C 70 11.5 60.5 8 50 8 Z" 
          fill="url(#oz-blue-grad-dark)" />

    <!-- Contrail Swoop -->
    <path d="M 16 66 C 24 78 40 84 56 81 C 72 78 84 66 90 50 C 92 44 95 36 102 24" 
          stroke="url(#oz-sunset-grad-dark)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <path d="M 28 76 C 42 84 58 83 72 75 C 82 69 90 59 95 47" 
          stroke="url(#oz-sunset-grad-dark)" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

    <!-- Jet at Apex -->
    <g transform="translate(100, 22) rotate(42) scale(1.15)">
      <path d="M 0 -14 L 5 2 L 14 6 L 14 9 L 5 8 L 3 14 L 7 17 L 7 19 L 0 18 L -7 19 L -7 17 L -3 14 L -5 8 L -14 9 L -14 6 L -5 2 Z" 
            fill="url(#oz-sunset-grad-dark)" />
      <circle cx="0" cy="-6" r="1.5" fill="#FFFFFF" />
    </g>

    <polygon points="50,22 52,29 59,31 52,33 50,40 48,33 41,31 48,29" fill="url(#oz-sunset-grad-dark)" />
  </g>

  <!-- WORDMARK: Light text for Dark backgrounds -->
  <text x="145" y="72" 
        font-family="'Outfit', 'Montserrat', 'Inter', -apple-system, sans-serif" 
        font-size="48" 
        font-weight="900" 
        letter-spacing="-1.5px" 
        fill="#FFFFFF">OZO</text>

  <text x="260" y="72" 
        font-family="'Outfit', 'Montserrat', 'Inter', -apple-system, sans-serif" 
        font-size="48" 
        font-weight="700" 
        letter-spacing="-0.5px" 
        fill="url(#oz-blue-grad-dark)">TRIPS</text>

  <circle cx="432" cy="65" r="5" fill="url(#oz-sunset-grad-dark)" />

  <text x="148" y="96" 
        font-family="'Outfit', 'Montserrat', 'Inter', -apple-system, sans-serif" 
        font-size="12" 
        font-weight="700" 
        letter-spacing="5.5px" 
        fill="#94A3B8">EXPLORE THE WORLD</text>
</svg>
